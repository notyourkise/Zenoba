name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "20.19.0"
  DATABASE_URL: "postgresql://netloka:netloka_ci_password@127.0.0.1:5432/netloka?schema=public"
  AUTH_SECRET: "netloka_ci_auth_secret_minimum_32_characters_long_for_test"
  NEXTAUTH_SECRET: "netloka_ci_auth_secret_minimum_32_characters_long_for_test"
  NEXTAUTH_URL: "http://localhost:3000"

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Run ESLint
        run: npm run lint
      
      - name: Run TypeScript type check
        run: npm run typecheck

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    
    needs: [lint-and-typecheck]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Run unit/integration tests
        run: npm test
      
      - name: Upload test coverage (future enhancement)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: coverage/
          retention-days: 7

  test-e2e:
    name: Browser E2E Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: netloka
          POSTGRES_PASSWORD: netloka_ci_password
          POSTGRES_DB: netloka
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    needs: [test]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Push database schema
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
        run: npx prisma db push

      - name: Seed curriculum data
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
        run: npm run db:seed

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser E2E tests
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          AUTH_SECRET: ${{ env.AUTH_SECRET }}
          NEXTAUTH_SECRET: ${{ env.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ env.NEXTAUTH_URL }}
        run: npm run test:e2e -- --project=chromium

  build:
    name: Production Build
    runs-on: ubuntu-latest
    
    needs: [test-e2e]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Build Next.js application
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          AUTH_SECRET: ${{ env.AUTH_SECRET }}
          NEXTAUTH_SECRET: ${{ env.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ env.NEXTAUTH_URL }}
        run: npm run build
      
      - name: Verify production build output
        run: |
          # Verify .next directory exists and has expected structure
          if [ ! -d ".next" ]; then
            echo "❌ .next directory not found after build"
            exit 1
          fi
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: .next/
          retention-days: 3

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    
    needs: [lint-and-typecheck, test, test-e2e, build]
    
    outputs:
      passed: ${{ steps.quality-gate.outputs.passed }}
    
    steps:
      - name: Check all jobs succeeded
        id: quality-gate
        if: >
          always() &&
          needs.lint-and-typecheck.result == 'success' &&
          needs.test.result == 'success' &&
          needs.test-e2e.result == 'success' &&
          needs.build.result == 'success'
        
        run: |
          echo "passed=true" >> $GITHUB_OUTPUT
          echo "✅ All quality gates passed!"
      
      - name: Report failure
        if: >
          failure() || cancelled()
        
        run: |
          echo "❌ Quality gate failed"
          echo "Check the failed job(s) above"
          exit 1
