name: zenoba

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zenoba-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://zenoba:zenoba_dev_password@postgresql:5432/zenoba?schema=public
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: zenoba-secure-local-auth-secret-key-2026
      AUTH_SECRET: zenoba-secure-local-auth-secret-key-2026
      PORT: 3000
      HOSTNAME: "0.0.0.0"
    depends_on:
      postgresql:
        condition: service_healthy
    networks:
      - zenoba-network

  postgresql:
    image: postgres:16-alpine
    container_name: zenoba-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: zenoba
      POSTGRES_PASSWORD: zenoba_dev_password
      POSTGRES_DB: zenoba
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgresql_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zenoba"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - zenoba-network

networks:
  zenoba-network:
    driver: bridge

volumes:
  postgresql_data:
