name: netloka-production

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: netloka-app
    restart: always
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-netloka}:${POSTGRES_PASSWORD:-netloka_secure_password}@postgresql:5432/${POSTGRES_DB:-netloka}?schema=public
      NEXTAUTH_URL: https://netloka.biz.id
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      AUTH_SECRET: ${NEXTAUTH_SECRET}
    depends_on:
      postgresql:
        condition: service_healthy
    networks:
      - netloka-network
    expose:
      - "3000"

  postgresql:
    image: postgres:16-alpine
    container_name: netloka-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-netloka}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-netloka_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-netloka}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-netloka}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - netloka-network

  caddy:
    image: caddy:2-alpine
    container_name: netloka-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - netloka-network

networks:
  netloka-network:
    driver: bridge

volumes:
  postgres_prod_data:
  caddy_data:
  caddy_config:
