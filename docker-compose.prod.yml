name: zenoba-production

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zenoba-app
    restart: always
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-zenoba}:${POSTGRES_PASSWORD:-zenoba_secure_password}@postgresql:5432/${POSTGRES_DB:-zenoba}?schema=public
      NEXTAUTH_URL: https://zenoba.tech
      APP_URL: https://zenoba.tech
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      AUTH_SECRET: ${NEXTAUTH_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-smtp.hostinger.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-hello@zenoba.tech}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-hello@zenoba.tech}
      PAYMENT_MODE: ${PAYMENT_MODE:-disabled}
    depends_on:
      postgresql:
        condition: service_healthy
    networks:
      - zenoba-network
    expose:
      - "3000"

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-zenoba}:${POSTGRES_PASSWORD:-zenoba_secure_password}@postgresql:5432/${POSTGRES_DB:-zenoba}?schema=public
    command: npm run db:deploy
    profiles:
      - maintenance
    depends_on:
      postgresql:
        condition: service_healthy
    networks:
      - zenoba-network

  postgresql:
    image: postgres:16-alpine
    container_name: zenoba-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zenoba}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zenoba_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-zenoba}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zenoba}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - zenoba-network

  caddy:
    image: caddy:2-alpine
    container_name: zenoba-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - zenoba-network

networks:
  zenoba-network:
    driver: bridge

volumes:
  postgres_prod_data:
  caddy_data:
  caddy_config:
