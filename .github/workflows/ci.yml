name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: "20"
  Pnpm_VERSION: "9"

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run ESLint
        run: npm run lint
      
      - name: Run TypeScript type check
        run: npm run typecheck

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    
    needs: [lint-and-typecheck]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      
      - name: Install dependencies
        run: npm ci
      
      - name: Start PostgreSQL service (for database tests)
        uses: ./.github/actions/postgres-service
        if: false # Disabled for now - will be enabled when DB tests are added
      
      - name: Run unit/integration tests
        run: npm test
      
      - name: Upload test coverage (future enhancement)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: coverage/
          retention-days: 7

  build:
    name: Production Build
    runs-on: ubuntu-latest
    
    needs: [test]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build Next.js application
        run: npm run build
      
      - name: Verify production build output
        run: |
          # Verify .next directory exists and has expected structure
          if [ ! -d ".next" ]; then
            echo "❌ .next directory not found after build"
            exit 1
          fi
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: .next/
          retention-days: 3

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    
    needs: [lint-and-typecheck, test, build]
    
    outputs:
      passed: ${{ steps.quality-gate.outputs.passed }}
    
    steps:
      - name: Check all jobs succeeded
        id: quality-gate
        if: >
          always() &&
          needs.lint-and-typecheck.result == 'success' &&
          needs.test.result == 'success' &&
          needs.build.result == 'success'
        
        run: |
          echo "passed=true" >> $GITHUB_OUTPUT
          echo "✅ All quality gates passed!"
      
      - name: Report failure
        if: >
          failure() || cancelled()
        
        run: |
          echo "❌ Quality gate failed"
          echo "Check the failed job(s) above"
          exit 1
